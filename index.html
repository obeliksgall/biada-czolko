<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czółko - Wybór Kategorii</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #ff6b6b;
            --primary-hover: #ff5252;
            --secondary-color: #4ecdc4;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 750px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            margin: 0 0 5px 0;
            font-size: 1.4rem;
        }

        p.subtitle {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Ekran kategorii - 3 kolumny */
        #category-screen {
            display: block;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .cat-btn {
            background-color: #f8f9fa;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 6px;
            font-size: 0.85rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 50px;
        }

        .cat-btn:hover {
            border-color: var(--primary-color);
            background-color: #fff0f0;
            color: var(--primary-color);
        }

        /* Ekran odliczania przed startem */
        #countdown-screen {
            display: none;
            padding: 30px 0;
        }

        .countdown-number {
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }

        /* Ekran gry */
        #game-screen {
            display: none;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .round-info {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e67e22;
            margin: 0;
        }

        .word-card {
            background-color: #fafafa;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 20px 10px;
            margin-bottom: 15px;
        }

        .word-card h2 {
            font-size: 1.6rem;
            color: #2c3e50;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-correct {
            background-color: #2ecc71;
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
        }
        .btn-correct:hover {
            background-color: #27ae60;
        }

        .btn-wrong {
            background-color: #e74c3c;
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
        }
        .btn-wrong:hover {
            background-color: #c0392b;
        }

        /* Ekran końca gry */
        #end-screen {
            display: none;
        }

        .score-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin: 10px 0;
        }

        .summary-list {
            text-align: left;
            margin: 10px 0;
            max-height: 120px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 0;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .tag-good { color: #27ae60; font-weight: bold; }
        .tag-bad { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ekran Wyboru Kategorii -->
        <div id="category-screen">
            <h1>🎭 Czółko - Wybierz kategorię</h1>
            <p class="subtitle">Wybierz temat, masz po 2 minuty na rundę.</p>
            <div class="categories-grid">
                <button class="cat-btn" onclick="selectCategory('muzyka')">🎵 Słowa z Piosenek</button>
                <button class="cat-btn" onclick="selectCategory('piosenki_tyt')">🎙️ Piosenki (Tytuł i Wykonawca)</button>
                <button class="cat-btn" onclick="selectCategory('film')">🎬 Film</button>
                <button class="cat-btn" onclick="selectCategory('superbohater')">🦸 Superbohater</button>
                <button class="cat-btn" onclick="selectCategory('animacja')">🎨 Film animowany</button>
                <button class="cat-btn" onclick="selectCategory('przedmioty')">📦 Przedmioty</button>
                <button class="cat-btn" onclick="selectCategory('geografia')">🌍 Stolice i Państwa</button>
                <button class="cat-btn" onclick="selectCategory('ludzie')">⭐ Sławni ludzie</button>
                <button class="cat-btn" onclick="selectCategory('nie_uwierzysz')">✨ Nie uwierzysz</button>
            </div>
        </div>

        <!-- Ekran Odliczania -->
        <div id="countdown-screen">
            <h1>Przygotuj się!</h1>
            <p class="subtitle">Przyóż telefon do czoła...</p>
            <div class="countdown-number" id="countdown-display">5</div>
        </div>

        <!-- Ekran Gry -->
        <div id="game-screen">
            <div class="game-header">
                <div class="round-info" id="round-counter">Runda 1</div>
                <div class="timer" id="timer">02:00</div>
            </div>
            
            <div class="word-card">
                <h2 id="current-word">SŁOWO</h2>
            </div>

            <div class="action-buttons">
                <button class="btn btn-wrong" onclick="answer(false)">ŹLE</button>
                <button class="btn btn-correct" onclick="answer(true)">DOBRZE</button>
            </div>
        </div>

        <!-- Ekran Podsumowania -->
        <div id="end-screen">
            <h1>Koniec Gry!</h1>
            <p class="subtitle">Twój ostateczny wynik:</p>
            <div class="score-display" id="final-score">0</div>
            
            <div class="summary-list" id="summary-list">
                <!-- Wyniki -->
            </div>

            <button class="btn" onclick="resetToCategories()">WYBIERZ INNĄ KATEGORIĘ</button>
        </div>
    </div>

    <script>
        const categories = {
            muzyka: [
                "Sen", "Miłość", "Wolność", "Bóg", "Krew", "Cisza", "Wiatr", "Deszcz", "Ogień", "Noc",
                "Dzień", "Gwiazdy", "Łzy", "Czas", "Droga", "Dom", "Miasto", "Ręce", "Oczy", "Serce",
                "Głowa", "Taniec", "Muzyka", "Głos", "Krzyk", "Prawda", "Kłamstwo", "Szczęście", "Życie", "Śmierć",
                "Anioł", "Diabeł", "Ból", "Strach", "Nadzieja", "Wiara", "Pamięć", "Blask", "Cień", "Kolory",
                "Złoto", "Srebro", "Kamień", "Piasek", "Morze", "Ocean", "Rzeka", "Las", "Drzewo", "Kwiat",
                "Ptak", "Lot", "Skrzydła", "Bieg", "Krok", "Ślad", "Twarz", "Usta", "Włosy", "Oddech",
                "Ciało", "Dusza", "Myśl", "Słowo", "List", "Książka", "Film", "Obraz", "Rama", "Okno",
                "Drzwi", "Klucz", "Zamek", "Most", "Rampa", "Scena", "Bilet", "Pociąg", "Dworzec", "Autobus",
                "Auto", "Mapa", "Kompas", "Północ", "Południe", "Wschód", "Zachód", "Ziemia", "Niebo",
                "Słońce", "Księżyc", "Chmura", "Burza", "Tęcza", "Śnieg", "Mróz", "Lato", "Zima", "Wiosna",
                "Jesień", "Kawiarnia", "Bar", "Stół", "Krzesło", "Szklanka", "Butelka", "Wino", "Piwo", "Kawa",
                "Papieros", "Dym", "Popiół", "Klub", "Neon", "Ulica", "Aleja", "Park", "Ławka", "Latarnia",
                "Plac", "Brama", "Podwórko", "Schody", "Strych", "Piwnica", "Korytarz", "Lustro", "Zegar", "Sekunda",
                "Minuta", "Godzina", "Wieczorek", "Świt", "Zmierzch", "Pożegnanie", "Powitanie", "Tęsknota", "Zazdrość", "Gniew",
                "Uśmiech", "Płacz", "Szept", "Pocałunek", "Dotyk", "Ramiona", "Plecy", "Brzuch", "Nogi", "Stopy"
            ],
            piosenki_tyt: [
                "Sen o Warszawie - Czesław Niemen", "Mniej niż zero - Lady Pank", "Dni, których nie znamy - Marek Grechuta",
                "Arahja - Kult", "Przez twe oczy zielone - Akcent", "Zawsze tam, gdzie ty - Lady Pank",
                "Autostrada do wolności - Perfect", "Dmuchawce, latawce, wiatr - Urszula", "Ostatni taniec - Sanah",
                "Małomiasteczkowy - Dawid Podsiadło", "Początek - Podsiadło / Zalewski / Kortez", "Cykady na Cykladach - Maanam",
                "Kawiarnia - Kortez", "Złoty piasek - Mrozu", "Oprócz błękitnego nieba - Maanam", "Kiedy powiem sobie dość - O.N.A.",
                "Kochać inaczej - De Mono", "Błysk - Brodka", "Statki na niebie - De Mono", "Wszystko mi mówi, że mnie ktoś pokochał - Skaldowie"
            ],
            film: [
                "Gladiator", "Titanic", "Incepcja", "Matrix", "Kiler", "Psy", "Avatar", "Skazani na Shawshank",
                "Ojciec chrzestny", "Pulp Fiction", "Forrest Gump", "Terminator", "Rocky", "Szczęki", "Interstellar",
                "Szybcy i wściekli", "Zielona mila", "Król Lew", "Władca Pierścieni", "Harry Potter"
            ],
            superbohater: [
                "Batman", "Superman", "Spider-Man", "Iron Man", "Kapitan Ameryka", "Thor", "Hulk", "Wolverine",
                "Deadpool", "Flash", "Aquaman", "Wonder Woman", "Czarna Wdowa", "Czarna Pantera", "Doktor Strange",
                "Ant-Man", "Thanos", "Joker", "Harley Quinn", "Venom"
            ],
            animacja: [
                "Król Lew", "Shrek", "Kraina Lodu", "Toy Story", "Gdzie jest Nemo?", "Madagaskar", "Minionki",
                "Auta", "Epoka lodowcowa", "Iniemamocni", "Ratatuj", "Odlot", "W głowie się nie mieści", "Coco",
                "Vaiana", "Zaplątani", "Mulan", "Aladyn", "Piękna i Bestia", "Mała Syrenka"
            ],
            przedmioty: [
                "Długopis", "Szklanka", "Krzesło", "Klocek hamulcowy", "Prostownica", "Zmywarka", "Lustro",
                "Odkurzacz", "Mikser", "Zegarek", "Poduszka", "Klucze", "Grzebień", "Parasol", "Portfel",
                "Latarka", "Nożyczki", "Suszarka", "Słuchawki", "Walizka"
            ],
            geografia: [
                "Polska", "Warszawa", "Francja", "Paryż", "Włochy", "Rzym", "Hiszpania", "Madryt", 
                "Niemcy", "Berlin", "Japonia", "Tokio", "Wielka Brytania", "Londyn", "Stany Zjednoczone", 
                "Waszyngton", "Grecja", "Ateny", "Egipt", "Kair", "Brazylia", "Brasilia", 
                "Kanada", "Ottawa", "Australia", "Canberra", "Norwegia", "Oslo", "Szwecja", "Sztokholm", 
                "Czechy", "Praga", "Węgry", "Budapeszt", "Austria", "Wiedeń", "Portugalia", "Lizbona", "Chiny", "Pekin"
            ],
            ludzie: [
                "Robert Lewandowski", "Albert Einstein", "Napoleon Bonaparte", "Mikołaj Kopernik", "Elon Musk",
                "Cristiano Ronaldo", "Leo Messi", "Marie Curie-Skłodowska", "Jan Paweł II", "Cleopatra",
                "Leonardo da Vinci", "William Szekspir", "Adam Małysz", "Iga Świątek", "Freddie Mercury",
                "Michael Jackson", "Winston Churchill", "Abraham Lincoln", "Pablo Picasso", "Steve Jobs"
            ],
            nie_uwierzysz: [
                "Nie zesraj się", "Wszyscy umrzemy", "Nie chcę mi się z Tobą gadać", "Fajrant", 
                "Mango", "Różowy", "Bitch face", "Jest życie w człowieku?", "Medjugorie", 
                "Pielgrzymka", "Nowe nie znałam", "Mała Hania w środku nie jest zadowolana", 
                "Zapasowy karmiciel", "Daniel", "Życie jest piękne ale nie Twoje akurat"
            ]
        };

        let currentRound = 0;
        let score = 0;
        let totalRounds = 0;
        let timerInterval = null;
        let countdownInterval = null;
        let timeLeft = 120; // 2 minuty
        let countdownTime = 5; // 5 sekund odliczania
        let availableWords = [];
        let gameHistory = [];
        let currentWord = "";

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function selectCategory(categoryKey) {
            currentRound = 0;
            score = 0;
            gameHistory = [];
            
            availableWords = [...categories[categoryKey]];
            shuffle(availableWords);
            totalRounds = availableWords.length;

            // Ukryj ekran kategorii i pokaż ekran odliczania
            document.getElementById('category-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('countdown-screen').style.display = 'block';

            startCountdown();
        }

        function startCountdown() {
            countdownTime = 5;
            document.getElementById('countdown-display').innerText = countdownTime;

            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                countdownTime--;
                document.getElementById('countdown-display').innerText = countdownTime;

                if (countdownTime <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('countdown-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'block';
                    nextRound();
                }
            }, 1000);
        }

        function resetToCategories() {
            clearInterval(timerInterval);
            clearInterval(countdownInterval);
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('countdown-screen').style.display = 'none';
            document.getElementById('category-screen').style.display = 'block';
        }

        function nextRound() {
            if (availableWords.length === 0) {
                endGame();
                return;
            }

            currentRound++;
            document.getElementById('round-counter').innerText = `Runda ${currentRound} / ${totalRounds}`;
            
            currentWord = availableWords.pop();
            document.getElementById('current-word').innerText = currentWord;

            clearInterval(timerInterval);
            timeLeft = 120;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    answer(false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            document.getElementById('timer').innerText = `${minutes}:${seconds}`;
        }

        function answer(isCorrect) {
            clearInterval(timerInterval);

            if (isCorrect) {
                score++;
                gameHistory.push({ word: currentWord, status: true });
            } else {
                gameHistory.push({ word: currentWord, status: false });
            }

            nextRound();
        }

        function endGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            
            document.getElementById('final-score').innerText = `${score} / ${totalRounds}`;

            let summaryListHTML = '';
            gameHistory.forEach(item => {
                let statusText = item.status ? '<span class="tag-good">DOBRZE</span>' : '<span class="tag-bad">ŹLE</span>';
                summaryListHTML += `
                    <div class="summary-item">
                        <span>${item.word}</span>
                        <span>${statusText}</span>
                    </div>
                `;
            });
            document.getElementById('summary-list').innerHTML = summaryListHTML;
        }
    </script>
</body>
</html>
