<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Jasne, nowoczesne tło z delikatnym gradientem -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fbfb" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    
    <!-- Cień dla elementów -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Główny kwadrat ikony z zaokrąglonymi rogami (styl aplikacji mobilnej) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Dekoracyjny element muzyczny w tle -->
  <path d="M380 140v145a45 45 0 1 1-30-42.43V170h-80v155a45 45 0 1 1-30-42.43V140h110z" fill="#ff6b6b" opacity="0.15" />

  <!-- Sylwetka głowy (motyw Czółka) -->
  <g filter="url(#shadow)">
    <!-- Szyja i ramiona -->
    <path d="M190 390c0-40 30-70 66-70h60c36 0 66 30 66 70v32H190v-32z" fill="#4ecdc4" />
    
    <!-- Głowa -->
    <circle cx="256" cy="220" r="95" fill="#ffffff" />
    
    <!-- Obrys głowy / ekranu -->
    <circle cx="256" cy="220" r="95" fill="none" stroke="#2c3e50" stroke-width="14" />
  </g>

  <!-- Centralny element: Nuta muzyczna i znak zapytania / interakcja -->
  <g transform="translate(0, 5)">
    <!-- Kolorowa nutka symbolizująca muzyczny charakter -->
    <path d="M285 165v75a25 25 0 1 1-18-24.03V180h-45v50a25 25 0 1 1-18-24.03V165h63z" fill="#ff6b6b" />
  </g>

  <!-- Małe akcenty gwiazdek/iskierzek wokół ikony (nadające imprezowy charakter) -->
  <path d="M110 160l8 18 18 8-18 8-8 18-8-18-18-8 18-8z" fill="#ff6b6b" opacity="0.8" />
  <path d="M400 320l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#4ecdc4" opacity="0.9" />
</svg>
